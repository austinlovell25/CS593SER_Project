controller_names:
  - joint_trajectory_controller
  - gripper_trajectory_controller
  # - gripper_action_controller

joint_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - black_panda_joint1
    - black_panda_joint2
    - black_panda_joint3
    - black_panda_joint4
    - black_panda_joint5
    - black_panda_joint6
    - black_panda_joint7

gripper_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - black_panda_finger_joint1
    - black_panda_finger_joint2

